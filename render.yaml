services:
  - type: web
    name: netguard
    runtime: docker
    plan: free # Change to 'starter' ($7/mo) for native always-on compute with no idle spin-down
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
      - key: NETGUARD_CAPTURE_MODE
        value: agent
      # Set this to your Supabase PostgreSQL connection string in the Render dashboard.
      # Without it the service falls back to ephemeral SQLite (data lost on redeploy).
      - key: NETGUARD_DATABASE_URL
        sync: false
      # Optional: Explicit service URL for internal keep-alive loop (Render also auto-sets RENDER_EXTERNAL_URL).
      - key: NETGUARD_KEEP_ALIVE_URL
        sync: false
      # Allowed frontend origins (comma-separated). Set * or specific domain.
      - key: NETGUARD_CORS_ORIGINS
        value: "*"
      # Token the capture agent must send. Generate a long random string.
      - key: NETGUARD_AGENT_TOKEN
        sync: false

