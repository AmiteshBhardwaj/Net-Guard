services:
  netguard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netguard-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - NETGUARD_CAPTURE_MODE=local
      - PORT=8000
    volumes:
      - ./app:/app/app
      - ./backend:/app/backend
      - ./static:/app/static
      - ./data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
